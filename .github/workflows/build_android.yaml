name: Android CI/CD (Build & Deploy)

on:
  push:
    branches:
      - main
      - uat
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target Environment override (uat or prod)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build_and_deploy:
    name: Build & Deploy Android
    runs-on: ubuntu-latest
    env:
      PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Sanitize Gradle Properties for CI Runner
        run: |
          # Strip local machine-specific org.gradle.java.home if present so Gradle uses runner's JDK 21
          sed -i.bak '/^org\.gradle\.java\.home=/d' android/gradle.properties || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Determine Target Environment
        id: env_selector
        run: |
          # Detect branch or manual dispatch override
          BRANCH="${GITHUB_REF##*/}"
          MANUAL_OVERRIDE="${{ github.event.inputs.target_env }}"

          if [ -n "$MANUAL_OVERRIDE" ]; then
            TARGET_ENV="$MANUAL_OVERRIDE"
          elif [ "$BRANCH" = "uat" ]; then
            TARGET_ENV="uat"
          else
            TARGET_ENV="prod"
          fi

          echo "Selected Target Environment: $TARGET_ENV"
          echo "target_env=$TARGET_ENV" >> "$GITHUB_OUTPUT"

      - name: Inject Environment Secrets
        env:
          RAW_ENV_UAT: ${{ secrets.ENV_UAT }}
          RAW_ENV_PROD: ${{ secrets.ENV_PROD }}
        run: |
          TARGET_ENV="${{ steps.env_selector.outputs.target_env }}"

          # Touch dummy files so pubspec.yaml asset bundle validation succeeds
          touch .env.dev .env.uat .env.prod

          if [ "$TARGET_ENV" = "uat" ]; then
            echo "Writing .env.uat from GitHub Secrets..."
            if [ -n "$RAW_ENV_UAT" ]; then
              printf '%s\n' "$RAW_ENV_UAT" > .env.uat
            else
              echo "⚠️ WARNING: ENV_UAT secret is not set in GitHub Repository Secrets! Using fallback."
              echo "APP_ENV=.env.uat" > .env.uat
              echo "API_BASE_URL=https://uat.api.rexone.me" >> .env.uat
            fi
          else
            echo "Writing .env.prod from GitHub Secrets..."
            if [ -n "$RAW_ENV_PROD" ]; then
              printf '%s\n' "$RAW_ENV_PROD" > .env.prod
            else
              echo "⚠️ WARNING: ENV_PROD secret is not set in GitHub Repository Secrets! Using fallback."
              echo "APP_ENV=.env.prod" > .env.prod
              echo "API_BASE_URL=https://api.rexone.me" >> .env.prod
            fi
          fi

      - name: Inject Google Services Configuration (Android)
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON || secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          if [ -n "$ANDROID_GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$ANDROID_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ -f "android/app/google-services.json.example" ]; then
            echo "⚠️ WARNING: ANDROID_GOOGLE_SERVICES_JSON secret not configured. Using example file for compilation."
            cp android/app/google-services.json.example android/app/google-services.json
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Setup Android Keystore (Release Signing)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            mkdir -p android/keystores
            echo "$KEYSTORE_BASE64" | base64 -d > android/keystores/rexone-upload-keystore.jks
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            if [ -n "${{ secrets.KEY_ALIAS }}" ]; then
              echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            else
              echo "KEY_ALIAS=upload" >> $GITHUB_ENV
            fi
            if [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
              echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            fi
          else
            echo "❌ ERROR: ANDROID_KEYSTORE_BASE64 secret is not configured in GitHub Secrets. Release builds require release signing."
            exit 1
          fi

      - name: Read App Version from pubspec.yaml
        id: app_version
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          VERSION_NAME=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          BASE_BUILD=$(echo "$RAW_VERSION" | cut -d'+' -f2)
          # Automatically increment build number via GitHub run number
          BUILD_NUMBER=$(( BASE_BUILD + GITHUB_RUN_NUMBER ))

          TARGET_ENV="${{ steps.env_selector.outputs.target_env }}"

          if [ "$TARGET_ENV" = "uat" ]; then
            TAG_NAME="v${VERSION_NAME}-uat+${BUILD_NUMBER}"
            RELEASE_TITLE="UAT Android Build v${VERSION_NAME} (Build ${BUILD_NUMBER})"
            APK_NAME="rexone-uat-v${VERSION_NAME}-b${BUILD_NUMBER}.apk"
            AAB_NAME="rexone-uat-v${VERSION_NAME}-b${BUILD_NUMBER}.aab"
            PACKAGE_NAME="com.rex9.rexone.uat"
          else
            TAG_NAME="v${VERSION_NAME}+${BUILD_NUMBER}"
            RELEASE_TITLE="Production Android Release v${VERSION_NAME} (Build ${BUILD_NUMBER})"
            APK_NAME="rexone-prod-v${VERSION_NAME}-b${BUILD_NUMBER}.apk"
            AAB_NAME="rexone-prod-v${VERSION_NAME}-b${BUILD_NUMBER}.aab"
            PACKAGE_NAME="com.rex9.rexone"
          fi

          echo "Tag Name: $TAG_NAME"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "aab_name=$AAB_NAME" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Build Android App Bundle (AAB for Google Play)
        run: |
          TARGET_ENV="${{ steps.env_selector.outputs.target_env }}"
          export TARGET_ENV="$TARGET_ENV"
          flutter build appbundle --release \
            --build-name="${{ steps.app_version.outputs.version_name }}" \
            --build-number="${{ steps.app_version.outputs.build_number }}" \
            --dart-define=APP_ENV=.env.${TARGET_ENV} \
            --dart-define=TARGET_ENV=${TARGET_ENV}

      - name: Build Android APK (for direct download)
        run: |
          TARGET_ENV="${{ steps.env_selector.outputs.target_env }}"
          export TARGET_ENV="$TARGET_ENV"
          flutter build apk --release \
            --build-name="${{ steps.app_version.outputs.version_name }}" \
            --build-number="${{ steps.app_version.outputs.build_number }}" \
            --dart-define=APP_ENV=.env.${TARGET_ENV} \
            --dart-define=TARGET_ENV=${TARGET_ENV}

      - name: Prepare Release Artifacts
        run: |
          mkdir -p build/release-artifacts
          cp "build/app/outputs/flutter-apk/app-release.apk" "build/release-artifacts/${{ steps.app_version.outputs.apk_name }}"
          cp "build/app/outputs/bundle/release/app-release.aab" "build/release-artifacts/${{ steps.app_version.outputs.aab_name }}"
          echo "Prepared artifacts in build/release-artifacts"

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.env_selector.outputs.target_env }}
          path: build/release-artifacts/*
          retention-days: 30

      - name: Upload to Google Play (Internal Testing Track)
        if: env.PLAY_STORE_JSON_KEY != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: ${{ steps.app_version.outputs.package_name }}
          releaseFiles: build/release-artifacts/${{ steps.app_version.outputs.aab_name }}
          track: internal
          status: completed

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag_name }}
          name: ${{ steps.app_version.outputs.release_title }}
          prerelease: ${{ steps.env_selector.outputs.target_env == 'uat' }}
          files: |
            build/release-artifacts/${{ steps.app_version.outputs.apk_name }}
            build/release-artifacts/${{ steps.app_version.outputs.aab_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
